name: Daily paper feed

# Regenerates api/daily.json once a day, rebuilds the derived site (paper pages,
# venue hubs, sitemap) and commits whatever actually changed.
#
# Every generator is deterministic — no build timestamps, and each sitemap
# <lastmod> is the date that page's own file last changed in git rather than
# "today" — so on a normal day the only file that differs is api/daily.json and
# everything else produces an empty diff.

on:
  schedule:
    # 07:00 KST == 22:00 UTC the previous day. GitHub cron is always UTC.
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Full history: build.py derives sitemap <lastmod> from the last commit
      # that touched data/, which a depth-1 checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate daily.json (KST date)
        run: python build_api.py --daily-only

      # Order matters: build_sitemap.py stats the generated pages, so it can
      # only run once build_pages.py has written them.
      - name: Rebuild site, API, paper pages and sitemap
        run: |
          python build.py                 # data.json/data.js, index.html rows, robots
          python build_api.py             # api/*.json
          python build_pages.py --clean   # paper/<slug>/ + venue/<slug>/
          python build_sitemap.py         # sitemap.xml with per-page lastmod

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "chore: daily refresh $(TZ=Asia/Seoul date +%F)"
            echo "before=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bing / Yandex / Naver only. Google ignores IndexNow, but ChatGPT and
      # Perplexity lean on the Bing index, so this is the cheap AI-search path.
      # Only the URLs that actually changed are submitted — blasting all 1168
      # every day is exactly the abuse IndexNow rate-limits.
      - name: Ping IndexNow with changed URLs
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python indexnow.py --changed "${{ steps.commit.outputs.before }}" --submit
